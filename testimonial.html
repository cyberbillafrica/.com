<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucide Icons Demo</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    
    <div class="container py-5">
        
        <!-- Cards with Lucide Icons -->
        <div class="row g-4">
            
            <div class="col-md-3">
                <div class="card shadow-sm p-4 text-center h-100">
                    <i data-lucide="graduation-cap" style="width: 48px; height: 48px; color: #1a3a6b;"></i>
                    <h5 class="mt-3">LearnCore</h5>
                    <p class="text-muted">AI-Powered Learning Platform</p>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card shadow-sm p-4 text-center h-100">
                    <i data-lucide="brain" style="width: 48px; height: 48px; color: #198754;"></i>
                    <h5 class="mt-3">EduCore AI</h5>
                    <p class="text-muted">Education Intelligence</p>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card shadow-sm p-4 text-center h-100">
                    <i data-lucide="building-2" style="width: 48px; height: 48px; color: #ffc107;"></i>
                    <h5 class="mt-3">GovCore</h5>
                    <p class="text-muted">Government Platform</p>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card shadow-sm p-4 text-center h-100">
                    <i data-lucide="vote" style="width: 48px; height: 48px; color: #dc3545;"></i>
                    <h5 class="mt-3">PolitiCore</h5>
                    <p class="text-muted">Political Technology</p>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
    
</body>
</html>
